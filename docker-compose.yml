version: '3.5'
services:
  build-toolkit:
      image: tomhjx/hugo:dev-docsy0.4.0
      working_dir: /var/www
      environment:
        - TZ=Asia/Shanghai
      volumes:
        - ./src/archetypes:/var/www/archetypes
        - ./src/content:/var/www/content
        - ./src/config.yaml:/var/www/config.yaml
        - ./src/static:/var/www/static
        - ./src/layouts:/var/www/layouts
        - ./src/assets:/var/www/assets
        - ./public:/var/www/public